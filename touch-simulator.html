<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>터치 시뮬레이터</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f1a1a; --card:#121a22ee; --text:#e8fdf2; --sub:#6f8b86;
    --accent:#39ff9e; --accent2:#0fae6c; --gold:#ffcf4d; --line:#1e2d2a;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef6f1; --bg2:#dff3ea; --card:#ffffffee; --text:#0e2019; --sub:#4d685f;
      --accent:#0fae6c; --accent2:#0a8a54; --gold:#b9860a; --line:#cfe6da;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e14; --bg2:#0f1a1a; --card:#121a22ee; --text:#e8fdf2; --sub:#6f8b86;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  button, .tab, .subBtn, .qtyBtn{ outline:none; }
  button:focus, button:focus-visible{ outline:none; }
  ::selection{ background:transparent; }
  html,body{height:100%;}
  body{
    margin:0; color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,monospace;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 38px, color-mix(in srgb, var(--accent) 4%, transparent) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, color-mix(in srgb, var(--accent) 4%, transparent) 39px),
      linear-gradient(160deg, var(--bg), var(--bg2));
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:6px;
  }

  .stage{
    position:relative;
    width:100%; height:100%; max-width:1200px; max-height:760px;
    display:flex; flex-direction:column; gap:10px; align-items:stretch;
  }

  .left{
    flex:1.4; position:relative; border-radius:16px; overflow:hidden;
    background:var(--card); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    padding:10px; min-height:0;
  }
  .left::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 30%);
  }
  .topPanel{
    width:100%; flex:0 0 auto; display:flex; flex-direction:column; gap:4px;
  }
  .hud{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; row-gap:4px;
    font-size:.62rem; letter-spacing:1px; color:var(--sub); font-weight:700;
  }
  .lvBadge{
    display:flex; align-items:center; gap:5px; background:color-mix(in srgb, var(--accent) 14%, var(--card));
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius:8px; padding:3px 8px; color:var(--accent);
    flex:0 0 auto; white-space:nowrap;
  }
  .muteBtn{
    background:none; border:1px solid var(--line); color:var(--sub);
    border-radius:6px; font-size:.68rem; padding:2px 5px; cursor:pointer; line-height:1;
  }
  .titleTag{ color:var(--accent); white-space:nowrap; }
  .menuIconBtn.on{
    background:color-mix(in srgb,#ff4d4d 22%,var(--card)); border-color:#ff4d4d; color:#ff8a8a;
  }
  .hudSkinRow{
    width:100%; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:4px 8px;
  }
  .hudSkinRow::before{ content:"스킨"; font-size:.6rem; color:var(--sub); font-weight:700; flex:0 0 auto; margin-right:2px; }
  .hudSkinDot{
    position:relative; width:17px; height:17px; border-radius:50%; flex:0 0 auto;
    border:1px solid var(--line); cursor:pointer;
  }
  .hudSkinDot.locked{ cursor:default; filter:grayscale(1) brightness(.55); }
  .hudSkinDot.equipped{ border-color:#fff; box-shadow:0 0 0 2px var(--gold); }
  .hudSkinDot .lockIcon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.45rem; }
  .xpBar{
    height:5px; border-radius:3px; background:var(--line); overflow:hidden;
  }
  .xpFill{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .3s ease; }

  .missionBox{
    flex:0 0 auto; display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:8px; row-gap:2px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 10px;
  }
  .missionBox .missionText{ grid-column:1; grid-row:1; }
  .missionBox .missionReward{ grid-column:1; grid-row:2; }
  .missionBox .missionLifetime{ grid-column:1; grid-row:3; }
  .missionBox .missionClaim{ grid-column:2; grid-row:1 / span 3; align-self:center; }
  .missionBox .missionBarBg{ grid-column:1 / -1; grid-row:4; margin-top:3px; }
  .missionBox.skinMilestone{ opacity:.9; }
  .missionBox.missionSpecial{
    position:relative; border:1px solid transparent;
    background-image:linear-gradient(var(--card),var(--card)), linear-gradient(90deg,#ff4d4d,#ffb238,#ffe14d,#4affa1,#4ea1ff,#b26bff,#ff4d4d);
    background-origin:border-box; background-clip:padding-box, border-box;
    background-size:100% 100%, 300% 100%;
    animation:mythicShift 3s linear infinite;
    box-shadow:0 0 8px rgba(255,255,255,.18);
  }
  .missionBox.missionWeekly{ position:relative; border-color:color-mix(in srgb, var(--accent) 55%, transparent); }
  .missionWeeklyTag{
    position:absolute; top:-9px; left:10px; font-size:.56rem; font-weight:800; color:var(--bg);
    background:var(--accent); padding:2px 8px; border-radius:8px;
  }
  .missionSpecialTag{
    position:absolute; top:-9px; left:10px; font-size:.56rem; font-weight:800; color:#2a1c00;
    background:linear-gradient(90deg,#ffe14d,#ffb238); padding:2px 8px; border-radius:8px;
  }
  .missionBox.skinMilestone.unlocked{ border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .missionText{ font-size:.7rem; color:var(--text); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .missionReward{ font-size:.62rem; color:var(--gold); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .missionLifetime{ font-size:.56rem; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .missionBarBg{ width:100%; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .missionBarFill{ height:100%; width:0%; background:linear-gradient(90deg,#ffb238,var(--gold)); transition:width .3s ease; }
  .missionClaim{
    align-self:flex-end; border:none; border-radius:7px; padding:5px 14px; font-size:.66rem; font-weight:800;
    background:var(--line); color:var(--sub); cursor:pointer;
  }
  .missionClaim.ready{ background:var(--gold); color:#2a1c00; }
  .missionClaim.claimed{ background:var(--line); color:var(--sub); cursor:default; opacity:.6; }
  #missionTab{ flex-direction:column; gap:8px; overflow-x:hidden; overflow-y:auto; padding-top:10px; }

  #shopTab{ flex-direction:column; gap:5px; overflow-x:hidden; overflow-y:auto; }
  #shopTab .item{
    flex:0 0 auto; flex-direction:row; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 10px; border-radius:10px;
  }
  #shopTab .item .info{ min-width:0; flex:1; }
  #shopTab .item .name{ font-size:.76rem; }
  #shopTab .item .desc{ font-size:.62rem; margin-top:1px; line-height:1.3; }
  #shopTab .item button{ align-self:center; min-width:82px; padding:7px 8px; font-size:.7rem; }
  #shopTab .item.canBuy{ border-color:color-mix(in srgb, var(--accent) 55%, transparent); }
  #shopTab .item.maxed{ opacity:.6; }
  .shopHead{
    flex:0 0 auto; position:sticky; top:0; z-index:2; margin-top:4px;
    font-size:.66rem; font-weight:800; color:var(--accent); letter-spacing:.5px;
    background:var(--bg2); padding:3px 4px; border-bottom:1px solid var(--line);
  }
  .skinRow{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .skinItem{
    flex:0 0 170px; height:128px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:5px;
    background:var(--card); border-radius:10px; padding:9px 8px; font-size:.62rem;
    opacity:.35; border:1px solid var(--line);
  }
  .skinItem.done{ opacity:1; border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .skinItem.equipped{ border-color:var(--gold); box-shadow:0 0 10px color-mix(in srgb, var(--gold) 30%, transparent); }
  #skinTab{ overflow-y:auto; align-items:flex-start; }
  .skinItem > *{ flex-shrink:0; }
  .skinItem .swatch{ flex:0 0 auto; width:28px; height:28px; border-radius:50%; }
  .skinItem .skinName{ color:var(--accent); font-weight:800; text-align:center; }
  .skinItem .skinUnlockHint{ color:var(--sub); font-size:.56rem; text-align:center; line-height:1.3; white-space:nowrap; }
  .skinItem .skinAbility{ color:var(--gold); font-size:.58rem; font-weight:700; text-align:center; }
  .skinItem .equipBtn{
    margin-top:auto;
    width:100%; border:none; border-radius:7px; padding:5px 0; font-size:.6rem; font-weight:800;
    background:var(--line); color:var(--sub); cursor:pointer;
  }
  .skinItem.done .equipBtn{ background:color-mix(in srgb, var(--accent) 25%, var(--card)); color:var(--accent); cursor:pointer; }
  .skinItem.equipped .equipBtn{ background:var(--gold); color:#2a1c00; }

  .combo{
    text-align:center;
    font-size:.7rem; color:var(--gold); font-weight:800; letter-spacing:1px; height:14px;
    opacity:0; transition:opacity .2s ease;
  }
  .combo.show{ opacity:1; }

  .centerArea{
    flex:1; min-height:0; width:100%; margin-top:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .score{
    flex:0 0 auto;
    font-size:2.5rem; font-weight:900; margin:0; color:var(--text);
    letter-spacing:1px; font-variant-numeric:tabular-nums;
  }
  .rate{ flex:0 0 auto; color:var(--sub); font-size:.72rem; margin:2px 0 10px; letter-spacing:.5px;}
  .kbHint{color:var(--sub); font-size:.6rem; opacity:.6; margin-bottom:8px;}

  .touchWrap{
    position:relative; flex:0 0 auto; margin:16px auto 0;
    width:150px; height:150px;
  }
  .coreRing{
    position:absolute; inset:-8px; border-radius:50%;
    border:2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    animation:ringSpin 14s linear infinite;
  }
  .coreRing.ring2{
    inset:-20px; border-style:solid; border-width:1px;
    border-color:color-mix(in srgb, var(--accent) 22%, transparent);
    animation-duration:20s; animation-direction:reverse;
  }
  @keyframes ringSpin{ to{ transform:rotate(360deg); } }

  .touchBtn{
    position:absolute; inset:4px; border-radius:50%; border:none; cursor:pointer; z-index:2;
    background:
      radial-gradient(circle at 50% 34%, color-mix(in srgb, var(--accent) 88%, white) 0%, var(--accent) 32%, var(--accent2) 64%, #062617 100%);
    box-shadow:
      0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent),
      0 0 32px color-mix(in srgb, var(--accent) 55%, transparent),
      inset 0 -10px 18px rgba(0,0,0,.35),
      inset 0 8px 16px rgba(255,255,255,.28);
    color:#04160e; font-size:1.05rem; font-weight:900; letter-spacing:3px;
    transition:transform .05s ease; -webkit-tap-highlight-color:transparent; user-select:none;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    animation:corePulse 2.6s ease-in-out infinite;
  }
  @keyframes corePulse{
    0%,100%{
      box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent),
        0 0 32px color-mix(in srgb, var(--accent) 55%, transparent),
        inset 0 -10px 18px rgba(0,0,0,.35), inset 0 8px 16px rgba(255,255,255,.28);
    }
    50%{
      box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 32%, transparent),
        0 0 48px color-mix(in srgb, var(--accent) 68%, transparent),
        inset 0 -10px 18px rgba(0,0,0,.35), inset 0 8px 16px rgba(255,255,255,.28);
    }
  }
  .touchBtn:active{ transform:scale(.92); }
  .touchBtn.kbPress{ transform:scale(.92); }

  .float{
    position:absolute; left:50%; top:20%; transform:translate(-50%,0);
    font-weight:900; color:var(--gold); pointer-events:none; z-index:5;
    text-shadow:0 0 6px var(--gold);
    animation:rise .7s ease-out forwards; font-size:1rem;
  }
  @keyframes rise{ to{ transform:translate(-50%,-80px); opacity:0; } }

  .spark{
    position:absolute; width:4px; height:4px; pointer-events:none; z-index:4;
    animation:sparkFly .55s ease-out forwards; background:var(--accent);
  }
  @keyframes sparkFly{ to{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }

  .right{
    flex:0 0 26%; min-height:140px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
  }
  .tabsRow{ display:flex; gap:6px; align-items:center; }
  .qtyRow{ display:flex; gap:4px; }
  .left{ box-shadow:inset 0 0 40px color-mix(in srgb, var(--accent) 7%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent); }
  .xpFill{ box-shadow:0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); }
  .combo{ font-size:.82rem; height:16px; text-shadow:0 0 10px color-mix(in srgb, var(--gold) 60%, transparent); }
  .combo.pop{ animation:comboPop .14s ease-out; }
  @keyframes comboPop{ 0%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  .reduceFx .combo.pop{ animation:none; }
  .monsterBox{
    position:relative; width:min(88%,290px); display:flex; align-items:center; gap:10px;
    padding:6px 10px; margin:2px 0 6px; border:1px solid var(--line); border-radius:12px;
    background:color-mix(in srgb, var(--card) 85%, transparent); flex:0 0 auto;
  }
  .monsterBox.boss{ border-color:#ff4d4d; box-shadow:0 0 12px rgba(255,77,77,.35); }
  .monsterEmoji{ font-size:1.9rem; line-height:1; flex:0 0 auto; }
  .monsterEmoji.hit{ animation:monsterHit .1s ease-out; }
  @keyframes monsterHit{ 0%{ transform:scale(.82) rotate(-7deg); } 100%{ transform:scale(1) rotate(0); } }
  .monsterInfo{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .monsterName{ font-size:.64rem; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .monsterBox.boss .monsterName{ color:#ff8a8a; }
  .monsterBar{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .monsterHpFill{ height:100%; width:100%; background:linear-gradient(90deg,#ff4d4d,#ff8a4d); transition:width .12s ease; }
  .monsterHpText{ font-size:.58rem; color:var(--sub); font-variant-numeric:tabular-nums; }
  .killPop{ position:absolute; right:12px; top:-4px; font-size:.78rem; font-weight:900; color:var(--gold); pointer-events:none; animation:killRise .9s ease-out forwards; }
  .killPop.fail{ color:#ff6b6b; }
  @keyframes killRise{ 0%{ transform:translateY(0); opacity:1; } 100%{ transform:translateY(-26px); opacity:0; } }
  .reduceFx .monsterEmoji.hit{ animation:none; }
  .huntMode .touchWrap{ display:none !important; }
  .huntMode .monsterBox{ flex-direction:column; width:min(92%,320px); gap:6px; padding:16px 14px; margin:8px 0; text-align:center; }
  .huntMode .monsterEmoji{ font-size:4.4rem; }
  .huntMode .monsterInfo{ width:100%; align-items:stretch; }
  .huntMode .monsterName{ font-size:.82rem; }
  .huntMode .monsterBar{ height:12px; }
  .huntMode .monsterHpText{ font-size:.7rem; }
  .dmgPop{ position:absolute; top:10px; font-size:.8rem; font-weight:900; color:#fff; text-shadow:0 0 6px #000; pointer-events:none; animation:dmgRise .7s ease-out forwards; }
  .dmgPop.crit{ color:#ff6b6b; font-size:1.05rem; }
  @keyframes dmgRise{ 0%{ transform:translateY(0); opacity:1; } 100%{ transform:translateY(-24px); opacity:0; } }
  .subBtn{
    flex:1; padding:5px 0; text-align:center; border-radius:6px; font-size:.64rem; font-weight:700;
    background:var(--card); color:var(--sub); cursor:pointer; border:1px solid var(--line);
  }
  .subBtn.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .subBtn.alert{ color:#ff8a8a; border-color:#ff4d4d; }
  .subBtn.active.alert{ background:#ff3b3b; color:#fff; border-color:#ff3b3b; }
  .tab.alert{ border-color:#ff4d4d; box-shadow:0 0 10px rgba(255,77,77,.35); }
  .tabBadge{
    position:absolute; top:2px; right:3px; min-width:15px; height:15px; line-height:15px; padding:0 4px;
    border-radius:7px; background:#ff3b3b; color:#fff; font-size:.58rem; font-weight:800; text-align:center;
  }
  .qtyBtn{
    flex:1; padding:4px 0; text-align:center; border-radius:6px; font-size:.62rem; font-weight:700;
    background:var(--card); color:var(--sub); cursor:pointer; border:1px solid var(--line);
  }
  .qtyBtn.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .tabs{ display:flex; gap:6px; flex:1; }
  .tab{
    position:relative; flex:1; padding:7px 0 8px; text-align:center; border-radius:10px; font-size:.7rem; line-height:1.2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:var(--card); color:var(--sub); cursor:pointer; border:1px solid var(--line); font-weight:700;
    transition:transform .1s ease;
  }
  .tab::before{ content:attr(data-icon); font-size:1.2rem; line-height:1; }
  .tab:active{ transform:scale(.94); }
  .tab.active{
    color:var(--bg); border-color:var(--accent); background:var(--accent);
    box-shadow:0 0 12px color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .listWrap{
    flex:1; overflow-x:auto; overflow-y:hidden; display:flex; flex-direction:row; gap:8px; padding-bottom:4px;
  }

  .item{
    flex:0 0 176px; display:flex; flex-direction:column; justify-content:space-between; gap:6px;
    background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:9px 10px;
  }
  .item .info{ display:flex; flex-direction:column; }
  .item .name{ font-weight:800; font-size:.76rem; }
  .item .desc{ color:var(--sub); font-size:.63rem; margin-top:1px; }
  .item button{
    border:none; border-radius:7px; padding:6px 9px; font-weight:800; font-size:.68rem;
    background:var(--accent); color:var(--bg); cursor:pointer; align-self:flex-start; min-width:58px;
  }
  .item button:disabled{ background:var(--line); color:var(--sub); cursor:default; }

  .achItem{
    flex:0 0 176px; display:flex; flex-direction:column; justify-content:space-between; gap:5px;
    background:var(--card); border-radius:10px; padding:9px 10px; font-size:.68rem;
    opacity:.35; border:1px solid var(--line);
  }
  .achItem.done{ opacity:1; border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .achItem.equipped{ border-color:var(--gold); box-shadow:0 0 10px color-mix(in srgb, var(--gold) 30%, transparent); }
  .achItem .achName{ color:var(--accent); font-weight:800; }
  .achItem .achDesc{ color:var(--sub); font-size:.6rem; }
  .achItem .achAbility{ color:var(--gold); font-size:.62rem; font-weight:700; }
  .achItem .equipBtn{
    margin-top:2px; border:none; border-radius:7px; padding:5px 0; font-size:.62rem; font-weight:800;
    background:var(--line); color:var(--sub); cursor:pointer;
  }
  .achItem.done .equipBtn{ background:color-mix(in srgb, var(--accent) 25%, var(--card)); color:var(--accent); cursor:pointer; }
  .achItem.equipped .equipBtn{ background:var(--gold); color:#2a1c00; }

  .resetBtn{ background:none; border:1px solid var(--line); color:var(--sub); border-radius:8px; padding:7px 10px; font-size:.63rem; cursor:pointer; white-space:nowrap; }

  .flash{
    position:absolute; inset:0; pointer-events:none; z-index:6; border-radius:16px;
    background:color-mix(in srgb, var(--accent) 22%, transparent); opacity:0;
  }
  .flash.go{ animation:flashPop .45s ease-out; }
  .flash.gold.go{ animation:flashPopGold .8s ease-out; }
  @keyframes flashPop{ 0%{ opacity:.9; } 100%{ opacity:0; } }
  @keyframes flashPopGold{
    0%{ opacity:0; background:radial-gradient(circle, rgba(255,225,140,.95), rgba(255,180,40,.5)); }
    35%{ opacity:1; }
    100%{ opacity:0; background:radial-gradient(circle, rgba(255,225,140,.95), rgba(255,180,40,.5)); }
  }

  .shake{ animation:shakeIt .5s ease; }
  @keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }

  .prestigeToast{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-10px) scale(.9);
    background:linear-gradient(135deg, #3a2a00, #1a1000);
    border:1px solid var(--gold);
    color:var(--gold); font-weight:900; font-size:1rem;

          loadingScreenEl.classList.add("hide");

  function costFor(def){
    const owned = state.owned[def.id] || 0;
    return Math.ceil(def.baseCost * Math.pow(def.costMul, owned));
  }

  let buyQty = 1;
  function costForN(def, qty){
    const owned = state.owned[def.id] || 0;
    let total = 0;
    for(let i=0;i<qty;i++){
      total += Math.ceil(def.baseCost * Math.pow(def.costMul, owned+i));
    }
    const discount = titleBonus("costDiscount") + skinBonus("costDiscount");
    if(discount>0) total = Math.ceil(total * (1-discount));
    return total;
  }

  const NUM_UNITS = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  function fmt(n){
    if(!isFinite(n)) return "∞";
    if(n < 1000) return Math.floor(n).toString();
    let idx = Math.floor(Math.log10(n) / 3);
    if(idx >= NUM_UNITS.length) return n.toExponential(2).replace("e+", "e");
    let v = n / Math.pow(10, idx * 3);
    if(v.toFixed(2) >= 1000 && idx + 1 < NUM_UNITS.length){ idx++; v = n / Math.pow(10, idx * 3); }
    return v.toFixed(idx === 1 ? 1 : 2) + NUM_UNITS[idx];
  }

  function levelFor(total){
    // level threshold grows: 100 * 1.35^(lv-1)
    let lv = 1, need = 100, acc = 0;
    while(acc + need <= total){ acc += need; lv++; need = Math.ceil(100 * Math.pow(1.35, lv-1)); }
    return { lv, into: total - acc, need };
  }

  function effClick(){

  function beep(freq, dur, type, vol){
    if(soundMuted) return;
    try{
      if(!window._actx) window._actx = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = window._actx;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type||"sine"; o.frequency.value = freq; g.gain.value = vol!=null?vol:0.05;
      o.connect(g); g.connect(ctx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (dur||0.05));
      o.stop(ctx.currentTime + (dur||0.05) + 0.02);
    }catch(e){}
  }

  function critChanceUpg(){ return (state.owned["critc"]||0) * 0.01; }
  function critMultNormal(){ return 5 + (state.owned["critm"]||0) * 0.25; }
  function allowedQty(def, qty){
    if(def.type === "speed") return speedBuyQty(def, qty);
    if(def.maxLevel) return Math.max(0, Math.min(qty, def.maxLevel - (state.owned[def.id]||0)));
    return qty;
  }
  function missionBoost(){ return (state.owned["mboost"]||0) * 0.10; }
  function missionScoreMult(){ return 1 + missionBoost(); }
  function missionDurMult(){ return 1 + missionBoost()*0.5; }
  function fmtDur(sec){ return (sec >= 60 && sec % 60 === 0) ? `${sec/60}분간` : `${sec}초간`; }
  function rewardInfo(m){
    const r = m.reward;
    if(r.type === "score"){
      const amount = Math.round(r.amount * missionScoreMult());
      return { amount, label:`+${amount.toLocaleString()}점` };
    }
    if(r.type === "buff" || r.type === "speed"){
      const sec = Math.round(r.duration * missionDurMult());
      return { duration:sec, label:`${fmtDur(sec)} ${r.type === "buff" ? "클릭파워" : "생산속도"} ×${r.mult}` };
    }
    return { label:m.rewardLabel };
  }

  function descFor(def){
    if(def.type === "critChance"){
      const lv = state.owned[def.id]||0;
      return lv >= def.maxLevel ? `크리티컬 확률 +${lv}%p (최대)` : `확률 +1%p (현재 +${lv}%p / 최대 +${def.maxLevel}%p)`;
    }
    if(def.type === "critMult"){
      const lv = state.owned[def.id]||0;
      return lv >= def.maxLevel ? `크리티컬 배율 ×${critMultNormal().toFixed(2)} (최대)` : `배율 +0.25 (현재 ×${critMultNormal().toFixed(2)} / 최대 ×${(5+def.maxLevel*0.25).toFixed(2)})`;
    }
    if(def.type === "mission"){
      return `미션 점수 +10% · 지속 +5% (현재 +${Math.round(missionBoost()*100)}%)`;
    }
    if(def.type === "speed"){
      return speedMaxed()
        ? `생산 주기 최대치 도달 (${TICK_FLOOR_MS}ms)`
        : `생산 주기 -${Math.round(def.power*100)}% (현재 ${autoTickMs()}ms · 최대 ${TICK_FLOOR_MS}ms)`;
    }
    const bonusKind = def.type === "click" ? "clickMult" : "autoMult";
    const effPower = Math.round(def.power * prestigeMult() * (1+titleBonus(bonusKind)));
    const unit = def.type === "click" ? "클릭당" : "초당";
    return `${unit} +${fmt(effPower)}`;
  }

  const TICK_FLOOR_MS = 150;
  function baseTickMs(l1, l2){ return 1000 * Math.pow(0.90, l1) * Math.pow(0.85, l2); }
  function autoTickMs(){
    const ms = baseTickMs(state.owned["speed1"]||0, state.owned["speed2"]||0) / activeTempSpeedMult();
    return Math.max(TICK_FLOOR_MS, Math.round(ms));
  }
  // 150ms is the max level: no more speed levels can be bought once the base interval reaches it
  function speedBuyQty(def, qty){
    const o = { speed1: state.owned["speed1"]||0, speed2: state.owned["speed2"]||0 };
    if(baseTickMs(o.speed1, o.speed2) <= TICK_FLOOR_MS) return 0;
    let k = 0;
    while(k < qty){
      o[def.id]++; k++;
      if(baseTickMs(o.speed1, o.speed2) <= TICK_FLOOR_MS) break;
    }
    return k;
  }
  function speedMaxed(){ return baseTickMs(state.owned["speed1"]||0, state.owned["speed2"]||0) <= TICK_FLOOR_MS; }

  const GROUP_ORDER = ["click","auto","speed","crit","mission"];
  const GROUP_LABEL = { click:"👆 클릭 파워", auto:"🤖 자동 생산", speed:"⚡ 생산 속도", crit:"💥 크리티컬", mission:"🎯 미션" };
  function groupOf(def){
    if(def.type === "critChance" || def.type === "critMult") return "crit";
    return def.type;
  }
  function renderShop(){
    const keepScroll = shopTab.scrollTop;
    shopTab.innerHTML = "";
    const sortedDefs = upgradeDefs.slice().sort((a,b)=>GROUP_ORDER.indexOf(groupOf(a)) - GROUP_ORDER.indexOf(groupOf(b)));
    let lastGroup = null;
    sortedDefs.forEach(def=>{
      const g = groupOf(def);
      if(g !== lastGroup){
        lastGroup = g;
        const h = document.createElement("div");
        h.className = "shopHead";
        h.textContent = GROUP_LABEL[g] || g;
        shopTab.appendChild(h);
      }
      const q = allowedQty(def, buyQty);
      const maxed = q === 0;
      const cost = maxed ? 0 : costForN(def, q);
      const owned = state.owned[def.id] || 0;
      const el = document.createElement("div");
      el.className = "item" + (!maxed && state.score >= cost ? " canBuy" : "") + (maxed ? " maxed" : "");

      shopTab.appendChild(el);
    });

  function buy(def, qty){
    qty = qty || 1;
    qty = allowedQty(def, qty);
    if(qty === 0) return;
    const cost = costForN(def, qty);
    if(state.score < cost) return;
    state.score -= cost;
    state.owned[def.id] = (state.owned[def.id]||0) + qty;
    checkDailyReset();
    state.dailyUpgradesBought += qty;
    state.weeklyUpgradesBought += qty;
    if(def.type === "click") state.clickPower += def.power*qty;
    else if(def.type === "auto") state.autoPerSec += def.power*qty;
    renderShop();
    updateUI();
    checkAch();
    upgradeImpact(def);
    if(def.type === "speed") startAutoTick();
    updateMissionBadge();
    save();
  }

  function claimMission(id){
    checkDailyReset();

    if(!m || alreadyClaimed || prog < m.target) return;

      state.weeklyClaims[id] = true;

      const angle = (Math.PI*2*i)/6 + Math.random()*0.3;

      s.style.setProperty("--dy", Math.sin(angle)*dist + "px");
      s.style.left = x + "px";

  /* ---- monsters: click/auto score is also damage ---- */
  const MONSTERS = [["슬라임","🟢"],["쥐","🐀"],["박쥐","🦇"],["늑대","🐺"],["멧돼지","🐗"],["좀비","🧟"],["고블린","👺"],["유령","👻"],["거미","🕷️"],["뱀","🐍"]];
  const BOSSES = [["킹 슬라임","👑"],["오우거","👹"],["드래곤","🐉"],["리치","💀"],["악마","😈"],["외계 괴수","👾"]];
  const BOSS_TIME_MS = 30000;
  const monsterBoxEl = document.getElementById("monsterBox");
  const monsterEmojiEl = document.getElementById("monsterEmoji");
  const monsterNameEl = document.getElementById("monsterName");
  const monsterHpFillEl = document.getElementById("monsterHpFill");
  const monsterHpTextEl = document.getElementById("monsterHpText");
  const huntBtnEl = document.getElementById("huntBtn");
  let bossUntil = 0;
  function isBoss(st){ return st % 10 === 0; }
  function monsterMaxHp(st){ return Math.ceil(15 * Math.pow(1.2, st-1) * (isBoss(st) ? 8 : 1)); }
  function monsterReward(st){ return Math.round(monsterMaxHp(st) * 0.5); }
  function monsterInfo(st){
    if(isBoss(st)){ const b = BOSSES[(st/10-1) % BOSSES.length]; return { name:b[0], emoji:b[1] }; }
    const m = MONSTERS[(st-1) % MONSTERS.length];
    return { name:m[0], emoji:m[1] };
  }
  function updateMonsterUI(){
    monsterBoxEl.style.display = state.hunting ? "flex" : "none";

    huntBtnEl.classList.toggle("on", !!state.hunting);
    huntBtnEl.textContent = state.hunting ? "⚔️ 도전 중" : "⚔️ 도전";
    const st = state.stage, boss = isBoss(st), max = monsterMaxHp(st), m = monsterInfo(st);
    monsterEmojiEl.textContent = m.emoji;
    let name = `${boss ? "👑 BOSS · " : ""}STAGE ${st} · ${m.name}`;
    if(boss) name += `  ⏱ ${Math.max(0, Math.ceil((bossUntil - Date.now())/1000))}초`;
    monsterNameEl.textContent = name;
    monsterBoxEl.classList.toggle("boss", boss);
    monsterHpFillEl.style.width = Math.max(0, Math.min(100, (state.monsterHp / max) * 100)) + "%";

  function initMonster(){
    if(!state.stage || state.stage < 1) state.stage = 1;
    const max = monsterMaxHp(state.stage);
    if(typeof state.monsterHp !== "number" || state.monsterHp <= 0 || state.monsterHp > max) state.monsterHp = max;
    bossUntil = isBoss(state.stage) ? Date.now() + BOSS_TIME_MS : 0;
    updateMonsterUI();

  function monsterPop(text, fail){
    const el = document.createElement("div");
    el.className = "killPop" + (fail ? " fail" : "");

    monsterBoxEl.appendChild(el);
    setTimeout(()=>el.remove(), 900);

  function dealDamage(d){
    if(!state.hunting || !(d > 0)) return;
    state.monsterHp -= d;
    let kills = 0, reward = 0, bossKilled = false;
    while(state.monsterHp <= 0 && kills < 25){
      const over = -state.monsterHp;
      const st = state.stage;
      reward += monsterReward(st);
      if(isBoss(st)) bossKilled = true;
      kills++;
      state.kills = (state.kills||0) + 1;
      state.stage = st + 1;
      if(state.stage > (state.bestStage||1)) state.bestStage = state.stage;
      state.monsterHp = Math.max(1, monsterMaxHp(state.stage) - over);
    }
    if(kills > 0){
      state.score += reward;
      state.total += reward;
      bossUntil = isBoss(state.stage) ? Date.now() + BOSS_TIME_MS : 0;
      monsterPop(kills > 1 ? `처치 ×${kills}  +${fmt(reward)}` : `+${fmt(reward)}`);

        tempClickBuffMult = 2;

  /* ---- auto-update for downloaded copies ----
     A saved file can't change itself, so on launch it asks UPDATE_URL for the newest file.
     If that file has a different GAME_VERSION it is shown in place of this one (saves are untouched).
     Inactive while UPDATE_URL is empty, inside claude.ai (always the latest there), or when offline. */
  const GAME_VERSION = "6";
  const UPDATE_URL = "";
  async function checkForUpdate(){
    try{
      if(!UPDATE_URL || window.claude || window.top !== window.self || !navigator.onLine) return;
      const res = await fetch(UPDATE_URL + (UPDATE_URL.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now(), { cache:"no-store" });
      if(!res.ok) return;
      const html = await res.text();
      const m = html.match(/const GAME_VERSION = "([^"]+)"/);
      if(!m || m[1] === GAME_VERSION) return;
      window.__updating = true;
      for(let i = setTimeout(()=>{}, 0); i > 0; i--){ clearInterval(i); clearTimeout(i); }
      document.body.innerHTML = "";
      document.body.style.cssText = "margin:0;padding:0;overflow:hidden;display:block;";
      const f = document.createElement("iframe");
      f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;";
      f.srcdoc = html;
      document.body.appendChild(f);
    }catch(e){ /* offline or blocked: keep playing the local copy */ }
  }

    menuViewEl.style.display = "none";
    settingsViewEl.style.display = "flex";
    menuOverlayEl.classList.add("show");
  });
  document.getElementById("setBack").addEventListener("click", ()=>{
    if(settingsFromMain){ settingsFromMain = false; closeMenu(); return; }
    settingsViewEl.style.display = "none";
    menuViewEl.style.display = "flex";
  });
  setReduceFxEl.addEventListener("click", ()=>{ state.reduceEffects = !state.reduceEffects; applySettings(); save(); });
  setVibrateEl.addEventListener("click", ()=>{
    state.vibrate = !state.vibrate;
    applySettings(); save();
    if(state.vibrate && navigator.vibrate) navigator.vibrate(30);
  });

  /* ---- Roguelite mode ---- */
  const rogueTouchBtn = document.getElementById("rogueTouchBtn");
  const rogueTouchWrapEl = document.getElementById("rogueTouchWrap");
  const rogueScoreEl = document.getElementById("rogueScoreEl");
  const rogueRateEl = document.getElementById("rogueRateEl");
  const rogueTimerEl = document.getElementById("rogueTimerEl");
  const rogueCoreEl = document.getElementById("rogueCoreEl");
  const buffOverlayEl = document.getElementById("buffOverlay");
  const buffTitleEl = document.getElementById("buffTitle");
  const buffCardsWrapEl = document.getElementById("buffCardsWrap");
  const runEndBoxEl = document.getElementById("runEndBox");
  const runEndTextEl = document.getElementById("runEndText");

  function sizeRogueTouchWrap(){
    const ca = rogueStageEl.querySelector(".centerArea");
    if(!ca || !ca.clientHeight) return;
    const availH = ca.clientHeight - rogueScoreEl.offsetHeight - rogueRateEl.offsetHeight - 50;
    const availW = ca.clientWidth - 20;
    const size = Math.max(70, Math.min(availH, availW, 180));
    rogueTouchWrapEl.style.width = size + "px";
    rogueTouchWrapEl.style.height = size + "px";
  }
  window.addEventListener("resize", sizeRogueTouchWrap);

  const ROGUE_DURATION = 60;
  const DIFFICULTIES = {
    normal:{ id:"normal", name:"보통", duration:60, interval:10, reward:1, desc:"60초 · 버프 10초마다 · 보상 ×1" },
    hard:{ id:"hard", name:"어려움", duration:45, interval:10, reward:1.5, desc:"45초 · 버프 10초마다 · 보상 ×1.5" },
    hell:{ id:"hell", name:"지옥", duration:30, interval:8, reward:2.5, desc:"30초 · 버프 8초마다 · 보상 ×2.5" },
  };
  let rogueDiff = DIFFICULTIES.normal;
  const diffOverlayEl = document.getElementById("diffOverlay");
  const diffCardsEl = document.getElementById("diffCards");
  function openDiffOverlay(){
    diffCardsEl.innerHTML = "";
    Object.values(DIFFICULTIES).forEach(d=>{
      const best = (state.rogueBestDiff && state.rogueBestDiff[d.id]) || 0;
      const btn = document.createElement("button");
      btn.className = "menuItemBtn diffCard " + d.id;
      btn.innerHTML = `<div class="dName">${d.name}</div><div class="dDesc">${d.desc}</div><div class="dBest">최고 기록 ${fmt(best)}</div>`;
      btn.addEventListener("click", ()=>{
        rogueDiff = d;
        diffOverlayEl.classList.remove("show");
        showRogueStage();
      });
      diffCardsEl.appendChild(btn);
    });
    diffOverlayEl.classList.add("show");
  }
  document.getElementById("diffCancel").addEventListener("click", ()=>diffOverlayEl.classList.remove("show"));
  diffOverlayEl.addEventListener("click", (e)=>{ if(e.target === diffOverlayEl) diffOverlayEl.classList.remove("show"); });
  const RARITY_LABEL = { rare:"희귀", epic:"에픽", legendary:"전설", mythic:"신화" };
  const RARITY_WEIGHT = { rare:60, epic:30, legendary:10, mythic:3 };
  const BUFF_POOL = [
    { name:"강한 손", desc:"클릭파워 +3", rarity:"rare", apply:()=>{ rogueClickPower += 3; } },
    { name:"파워 부스트", desc:"클릭파워 ×1.5", rarity:"epic", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*1.5); } },
    { name:"집중", desc:"클릭파워 +4", rarity:"rare", apply:()=>{ rogueClickPower += 4; } },
    { name:"숙련자의 손", desc:"클릭파워 +8", rarity:"epic", apply:()=>{ rogueClickPower += 8; } },
    { name:"행운의 손가락", desc:"크리티컬 확률 +10%p", rarity:"rare", apply:()=>{ rogueCritBonus += 0.10; } },
    { name:"이중 손놀림", desc:"클릭 시 30% 확률로 두 번 타격", rarity:"legendary", apply:()=>{ rogueDoubleChance += 0.3; } },
    { name:"연쇄 반응", desc:"두 번 타격 확률 +20%p", rarity:"epic", apply:()=>{ rogueDoubleChance += 0.2; } },
    { name:"필살의 일격", desc:"크리티컬 데미지 배율 +3배", rarity:"legendary", apply:()=>{ rogueCritMult += 3; } },
    { name:"강철 멘탈", desc:"크리티컬 확률 +25%p, 대신 클릭파워 -1", rarity:"epic", apply:()=>{ rogueCritBonus += 0.25; rogueClickPower = Math.max(1, rogueClickPower-1); } },
    { name:"시간 조작", desc:"남은 시간 +6초", rarity:"rare", apply:()=>{ rogueTimeLeft += 6; } },
    { name:"회복의 손길", desc:"남은 시간 +15초, 대신 클릭파워 -2", rarity:"epic", apply:()=>{ rogueTimeLeft += 15; rogueClickPower = Math.max(1, rogueClickPower-2); } },
    { name:"메아리의 축복", desc:"남은 시간 동안 초당 +3점 자동 획득", rarity:"rare", apply:()=>{ rogueAutoPerSec += 3; } },
    { name:"폭풍의 축복", desc:"남은 시간 동안 초당 +6점 자동 획득", rarity:"epic", apply:()=>{ rogueAutoPerSec += 6; } },
    { name:"만능 재주꾼", desc:"클릭파워 +1, 크리티컬 +5%p, 초당 +1", rarity:"rare", apply:()=>{ rogueClickPower += 1; rogueCritBonus += 0.05; rogueAutoPerSec += 1; } },
    { name:"광폭화", desc:"클릭파워 ×2, 대신 크리티컬 확률 -10%p", rarity:"epic", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*2); rogueCritBonus = Math.max(0, rogueCritBonus-0.10); } },
    { name:"폭주 모드", desc:"클릭파워 ×3, 대신 남은 시간 -10초", rarity:"legendary", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*3); rogueTimeLeft = Math.max(1, rogueTimeLeft-10); } },
    { name:"도박꾼의 감", desc:"50% 확률로 클릭파워 ×4, 50% 확률로 ×1.2", rarity:"legendary", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*(Math.random()<0.5?4:1.2)); } },
    { name:"궁극의 각성", desc:"클릭파워 ×5", rarity:"mythic", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*5); } },
    { name:"시간 정지", desc:"남은 시간 +30초", rarity:"mythic", apply:()=>{ rogueTimeLeft += 30; } },
    { name:"완전한 파괴", desc:"크리티컬 확률 +50%p, 크리티컬 배율 +5", rarity:"mythic", apply:()=>{ rogueCritBonus += 0.5; rogueCritMult += 5; } },
  ];

  const STARTING_PERKS = [
    { name:"빠른 손", desc:"시작 클릭파워 +3", apply:()=>{ rogueClickPower += 3; } },
    { name:"여유로운 준비", desc:"시작 시간 +10초", apply:()=>{ rogueTimeLeft += 10; } },
    { name:"예열된 엔진", desc:"시작 자동생산 +2/초", apply:()=>{ rogueAutoPerSec += 2; } },
    { name:"행운의 시작", desc:"시작 크리티컬 확률 +10%p", apply:()=>{ rogueCritBonus += 0.10; } },
    { name:"균형 잡힌 시작", desc:"클릭파워 +1, 크리티컬 +5%p, 시간 +5초", apply:()=>{ rogueClickPower += 1; rogueCritBonus += 0.05; rogueTimeLeft += 5; } },
  ];

  let roguePaused = false, buffUnlockTimer = null, rogueGraceUntil = 0;
  let rogueActive = false, rogueScore = 0, rogueClickPower = 1, rogueCritBonus = 0, rogueAutoPerSec = 0, rogueDoubleChance = 0, rogueCritMult = 5;
  let rogueTimeLeft = ROGUE_DURATION, rogueTimerId = null;
  let rogueElapsed = 0;

  function updateRogueUI(){
    rogueScoreEl.textContent = fmt(rogueScore);
    rogueRateEl.textContent = `클릭파워 ${rogueClickPower}`
      + (rogueCritBonus>0 ? ` · 크리티컬 +${Math.round(rogueCritBonus*100)}%p` : "")
      + (rogueAutoPerSec>0 ? ` · 초당 +${rogueAutoPerSec}` : "")
      + (rogueDoubleChance>0 ? ` · 더블 ${Math.round(rogueDoubleChance*100)}%` : "")
      + (rogueCritMult>5 ? ` · 크리티컬 배율 x${rogueCritMult}` : "");
    rogueTimerEl.textContent = rogueTimeLeft;
    rogueCoreEl.textContent = fmt(Math.max((state.rogueBestDiff && state.rogueBestDiff[rogueDiff.id]) || 0, rogueScore));
  }

  const SYNERGIES = [
    { id:"crit", name:"치명의 연계", pair:["행운의 손가락","필살의 일격"], desc:"크리티컬 확률 +10%p, 배율 +1", apply:()=>{ rogueCritBonus += 0.10; rogueCritMult += 1; } },
    { id:"twin", name:"쌍둥이 폭풍", pair:["이중 손놀림","연쇄 반응"], desc:"두 번 타격 확률 +15%p", apply:()=>{ rogueDoubleChance += 0.15; } },
    { id:"time", name:"시간의 지배자", pair:["시간 조작","회복의 손길"], desc:"남은 시간 +8초, 클릭파워 +3", apply:()=>{ rogueTimeLeft += 8; rogueClickPower += 3; } },
    { id:"echo", name:"폭풍의 합창", pair:["메아리의 축복","폭풍의 축복"], desc:"초당 +5점 추가", apply:()=>{ rogueAutoPerSec += 5; } },
    { id:"rage", name:"광전사의 각성", pair:["광폭화","폭주 모드"], desc:"크리티컬 확률 +20%p", apply:()=>{ rogueCritBonus += 0.20; } },
    { id:"balance", name:"완벽한 균형", pair:["만능 재주꾼","균형 잡힌 시작"], desc:"클릭파워 +3, 크리티컬 +5%p, 초당 +2", apply:()=>{ rogueClickPower += 3; rogueCritBonus += 0.05; rogueAutoPerSec += 2; } },
    { id:"power", name:"강화의 정수", pair:["숙련자의 손","파워 부스트"], desc:"클릭파워 ×1.3", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*1.3); } },
    { id:"gamble", name:"배수의 진", pair:["도박꾼의 감","강철 멘탈"], desc:"크리티컬 배율 +2", apply:()=>{ rogueCritMult += 2; } },
    { id:"myth", name:"신화의 공명", pair:["궁극의 각성","완전한 파괴"], desc:"클릭파워 ×1.5, 크리티컬 확률 +10%p", apply:()=>{ rogueClickPower = Math.round(rogueClickPower*1.5); rogueCritBonus += 0.10; } },
    { id:"forever", name:"영원한 폭풍", pair:["시간 정지","폭풍의 축복"], desc:"초당 +8점 추가", apply:()=>{ rogueAutoPerSec += 8; } },
  ];
  let rogueTaken = new Set(), rogueSynergyDone = new Set();
  const synergyToastEl = document.getElementById("synergyToast");
  let synergyToastTimer = null;
  function synergyFor(name){
    return SYNERGIES.find(sy=>!rogueSynergyDone.has(sy.id) && sy.pair.includes(name) && sy.pair.every(n=>n===name||rogueTaken.has(n)));
  }
  function showSynergyToast(sy){
    synergyToastEl.textContent = `✨ 시너지! ${sy.name} — ${sy.desc}`;
    synergyToastEl.classList.add("show");
    clearTimeout(synergyToastTimer);
    synergyToastTimer = setTimeout(()=>synergyToastEl.classList.remove("show"), 2800);
    beep(880,.12,"triangle",.07);
    setTimeout(()=>beep(1175,.2,"triangle",.08), 120);
  }
  function takeBuff(name){
    rogueTaken.add(name);
    SYNERGIES.forEach(sy=>{
      if(rogueSynergyDone.has(sy.id)) return;
      if(sy.pair.every(n=>rogueTaken.has(n))){
        rogueSynergyDone.add(sy.id);
        sy.apply();
        showSynergyToast(sy);
      }
    });
  }

  function pickBuffs(n){
    const pool = BUFF_POOL.slice();
    const picks = [];
    for(let k=0;k<n && pool.length;k++){
      const total = pool.reduce((s,b)=>s+RARITY_WEIGHT[b.rarity], 0);
      let r = Math.random()*total;
      let idx = 0;
      for(;idx<pool.length;idx++){
        r -= RARITY_WEIGHT[pool[idx].rarity];
        if(r<=0) break;
      }
      if(idx>=pool.length) idx = pool.length-1;
      picks.push(pool[idx]);
      pool.splice(idx,1);
    }
    return picks;
  }

  function showStartingPerkChoice(){
    roguePaused = true;
    if(document.activeElement) document.activeElement.blur();
    buffTitleEl.textContent = "✦ 시작 버프를 선택하세요";
    const pool = STARTING_PERKS.slice();
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
    const opts = pool.slice(0,3);
    buffCardsWrapEl.innerHTML = "";
    opts.forEach(opt=>{
      const card = document.createElement("div");
      card.className = "buffCard locked";
      card.innerHTML = `<div class="bName">${opt.name}</div><div class="bDesc">${opt.desc}</div>`;
      card.addEventListener("click", ()=>{
        if(card.classList.contains("locked")) return;
        opt.apply();
        takeBuff(opt.name);
        rogueGraceUntil = Date.now() + 400;
        buffOverlayEl.classList.remove("show");
        buffTitleEl.textContent = "✦ 능력을 선택하세요";
        updateRogueUI();
        beep(700,.15,"triangle",.06);
        rogueActive = true;
        roguePaused = false;
        startRogueTimerLoop();
      });
      buffCardsWrapEl.appendChild(card);
    });
    buffOverlayEl.classList.add("show");
    clearTimeout(buffUnlockTimer);
    buffUnlockTimer = setTimeout(()=>{
      buffCardsWrapEl.querySelectorAll(".buffCard").forEach(c=>c.classList.remove("locked"));
    }, 1000);
  }

  function showBuffChoice(){
    clearInterval(rogueTimerId);
    roguePaused = true;
    if(document.activeElement) document.activeElement.blur();
    const opts = pickBuffs(3);
    buffCardsWrapEl.innerHTML = "";
    opts.forEach(opt=>{
      const card = document.createElement("div");
      const syn = synergyFor(opt.name);
      card.className = "buffCard locked " + opt.rarity + (syn ? " synergy" : "");
      card.innerHTML = `<div><span class="bRarity ${opt.rarity}">${RARITY_LABEL[opt.rarity]}</span>${syn ? `<span class="bSynergy">✨ ${syn.name}</span>` : ""}</div><div class="bName">${opt.name}</div><div class="bDesc">${opt.desc}</div>`;
      card.addEventListener("click", ()=>{
        if(card.classList.contains("locked")) return;
        opt.apply();
        takeBuff(opt.name);
        rogueGraceUntil = Date.now() + 400;
        if(opt.rarity === "mythic"){
          state.rogueMythicCount = (state.rogueMythicCount||0) + 1;
          checkAch();
          renderAch();
          save();
        }
        buffOverlayEl.classList.remove("show");
        roguePaused = false;
        updateRogueUI();
        beep(700,.15,"triangle",.06);
        startRogueTimerLoop();
      });
      buffCardsWrapEl.appendChild(card);
    });
    buffOverlayEl.classList.add("show");
    clearTimeout(buffUnlockTimer);
    buffUnlockTimer = setTimeout(()=>{
      buffCardsWrapEl.querySelectorAll(".buffCard").forEach(c=>c.classList.remove("locked"));
    }, 1000);
  }

  const ROGUE_BUFF_INTERVAL = 10;

  function startRogueTimerLoop(){
    clearInterval(rogueTimerId);
    rogueTimerId = setInterval(()=>{
      rogueTimeLeft--;
      rogueElapsed++;
      if(rogueTimeLeft <= 0){
        endRogueRun();
        return;
      }
      if(rogueElapsed % rogueDiff.interval === 0){
        updateRogueUI();
        showBuffChoice();
        return;
      }
      if(rogueAutoPerSec > 0){
        rogueScore += rogueAutoPerSec;
      }
      updateRogueUI();
    }, 1000);
  }

  function startRogueRun(){
    rogueActive = false;
    roguePaused = false;
    rogueScore = 0;
    rogueClickPower = 1;
    rogueCritBonus = 0;
    rogueAutoPerSec = 0;
    rogueDoubleChance = 0;
    rogueCritMult = 5;
    rogueTimeLeft = rogueDiff.duration;
    rogueElapsed = 0;
    document.getElementById("rogueDiffTag").textContent = rogueDiff.name;
    rogueTaken = new Set();
    rogueSynergyDone = new Set();
    synergyToastEl.classList.remove("show");
    runEndBoxEl.classList.remove("show");
    buffOverlayEl.classList.remove("show");
    updateRogueUI();
    showStartingPerkChoice();
  }

  function endRogueRun(){
    clearInterval(rogueTimerId);
    rogueActive = false;
    roguePaused = false;
    const reward = Math.floor(rogueScore * 0.1 * rogueDiff.reward);
    state.score += reward;
    state.total += reward;
    state.rogueRunsPlayed = (state.rogueRunsPlayed||0) + 1;
    if(rogueScore > (state.rogueBest||0)) state.rogueBest = rogueScore;
    if(!state.rogueBestDiff) state.rogueBestDiff = {};
    if(rogueScore > (state.rogueBestDiff[rogueDiff.id]||0)) state.rogueBestDiff[rogueDiff.id] = rogueScore;
    checkAch();
    renderAch();
    save();
    updateRogueUI();
    runEndTextEl.textContent = `[${rogueDiff.name}] 획득 점수 ${fmt(rogueScore)} → 일반 모드에 +${fmt(reward)}점 (이 난이도 최고 ${fmt(state.rogueBestDiff[rogueDiff.id])})${rogueSynergyDone.size>0 ? ` · 시너지 ${rogueSynergyDone.size}개` : ""}`;
    runEndBoxEl.classList.add("show");
    const runEndBtnEl = document.getElementById("runEndBtn");
    runEndBtnEl.disabled = true;
    runEndBtnEl.style.opacity = ".45";
    setTimeout(()=>{ runEndBtnEl.disabled = false; runEndBtnEl.style.opacity = ""; }, 1000);
    beep(500,.2,"triangle",.07);
  }

  runEndBoxEl.querySelector("#runEndBtn").addEventListener("click", ()=>{
    runEndBoxEl.classList.remove("show");
    showMainMenu();
  });

  function handleRogueTouch(){
    if(!rogueActive || roguePaused || Date.now() < rogueGraceUntil) return;
    if(state.vibrate && navigator.vibrate) navigator.vibrate(8);
    const isCrit = Math.random() < (0.12 + rogueCritBonus);
    const isDouble = rogueDoubleChance > 0 && Math.random() < rogueDoubleChance;
    let amount = rogueClickPower;
    if(isCrit) amount *= rogueCritMult;
    if(isDouble) amount *= 2;
    rogueScore += amount;
    const rect = rogueTouchBtn.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    spawnFloat(cx + (Math.random()*36-18), rect.height*0.22, amount, isCrit?"crit":null, rogueTouchWrapEl);
    spawnSparks(cx, cy, rogueTouchWrapEl);
    beep(isCrit?820:480, isCrit?0.12:0.05, isCrit?"square":"sine", isCrit?0.07:0.045);
    updateRogueUI();
  }
  rogueTouchBtn.addEventListener("click", handleRogueTouch);

  load();
  applySettings();
  updateMenuStats();
  updateMissionBadge();
  if(!state.tutorialDone && (state.totalClicks||0) > 0) state.tutorialDone = true;
  initMonster();
  initLeaderboard();
  checkForUpdate();
  renderShop();
  renderAch();
  renderPrestige();
  renderStats();
  renderMission();
  applySkin();
  renderSkins();
  updateUI();

  function showOfflineEarnings(){
    if(!state.lastSave) return;
    const elapsedSec = Math.floor((Date.now() - state.lastSave)/1000);
    const CAP_SEC = 8*3600;
    const usedSec = Math.max(0, Math.min(elapsedSec, CAP_SEC));
    if(usedSec < 30 || state.autoPerSec <= 0) return;
    const earned = Math.round(effAuto() * usedSec * 0.5);
    if(earned <= 0) return;
    state.score += earned;
    state.total += earned;
    updateUI(); renderShop(); checkAch(); renderPrestige(); renderStats(); save();
    prestigeToastEl.textContent = `💤 자리 비운 사이 +${fmt(earned)} 획득!`;
    prestigeToastEl.classList.remove("hide");
    prestigeToastEl.classList.add("show");
    setTimeout(()=>{
      prestigeToastEl.classList.remove("show");
      prestigeToastEl.classList.add("hide");
    }, 2400);
  }
  showOfflineEarnings();

  function sizeTouchWrap(){
    const wrap = document.getElementById("touchWrap");
    const centerArea = document.querySelector(".centerArea");
    const comboH = comboEl.offsetHeight;
    const scoreH = scoreEl.offsetHeight;
    const rateH = rateEl.offsetHeight;
    const monsterH = (document.getElementById("monsterBox") || {offsetHeight:0}).offsetHeight + 8;
    const availH = centerArea.clientHeight - comboH - scoreH - rateH - monsterH - 50;
    const availW = centerArea.clientWidth - 20;
    const size = Math.max(70, Math.min(availH, availW, 180));
    wrap.style.width = size + "px";
    wrap.style.height = size + "px";
  }
  window.addEventListener("load", sizeTouchWrap);
  window.addEventListener("resize", sizeTouchWrap);
  sizeTouchWrap();
  setTimeout(sizeTouchWrap, 50);
  setTimeout(sizeTouchWrap, 300);

})();
</script>
</body>
</html>
